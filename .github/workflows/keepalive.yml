# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling them via the API monthly resets that timer,
# without needing commits.
name: keepalive

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in crosspost.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
