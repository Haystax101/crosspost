# All tunables in one place. Secrets never go here: see README "GitHub Secrets".

drive:
  inbox_folder: tiktok-inbox        # top-level Drive folder the iOS Shortcut saves into
  done_folder: done                 # subfolder of the inbox for processed files
  backfill_folder: backfill         # subfolder of the inbox for approved backfill files
  state_folder: crosspost-state     # top-level Drive folder holding the encrypted state
  state_file: state.json.enc

matching:
  window_minutes: 30                # max gap between TikTok create_time and the file's timestamp
  duration_tolerance_s: 1.0         # max gap between TikTok duration and ffprobe duration
  unmatched_retry_hours: 24         # after this, an unmatched TikTok post is flagged (and the run fails once)

captions:
  strip_tags: [fyp, foryou, foryoupage, fy, viral]   # case-insensitive, without '#'
  instagram_max_chars: 2200
  instagram_max_hashtags: 30
  youtube_title_max_chars: 100
  youtube_default_title: New video  # used when the caption has no usable first line

instagram:
  enabled: true
  api_version: v24.0
  share_to_feed: true
  poll_interval_s: 10
  poll_timeout_s: 600
  refresh_days_before_expiry: 15    # long-lived tokens last 60 days

youtube:
  enabled: true
  privacy_status: private           # private | unlisted | public. Unaudited API projects are forced to private anyway.
  category_id: "22"                 # People & Blogs
  made_for_kids: false
  daily_upload_limit: 6             # ~1600 quota units each on the default 10,000/day quota

retries:
  max_attempts: 5                   # per video, per platform

backfill:
  max_duration_s: 180
  local_dir: backfill               # downloads land here for spot-checking (gitignored)
  caption_match_threshold: 0.85     # fuzzy ratio at which a TikTok counts as already on Instagram
  max_per_day:                      # backfill items drained per day, oldest first
    instagram: 5
    youtube: 3
